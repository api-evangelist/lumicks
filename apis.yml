name: LUMICKS
description: >-
  LUMICKS is a life-science instrumentation company that builds tools to directly
  measure molecular and cellular interactions. Its Dynamic Single-Molecule platform,
  the C-Trap, uses optical tweezers to resolve real-time biomolecular interactions
  at the single-molecule level, while its Cell Avidity platforms (Avidion and the
  compact z-Movi) quantify the binding strength between immune cells and their
  targets for immuno-oncology, CAR-T, and antibody-therapeutics research. The
  developer surface is client-side: the official Apache-2.0 Python library
  lumicks.pylake analyzes single-molecule optical-tweezer data exported from the
  Bluelake acquisition software (force calibration, force-distance curve fitting,
  kymo/scan imaging, kymotracking, population dynamics), and bluelake-scripting
  automates instrument control. LUMICKS publishes no hosted public web API.
